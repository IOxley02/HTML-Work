<!-- **VERTEX SHADER** -->
<script id="vertex-shader" type="x-shader/x-vertex">

 

attribute  vec4 vPosition;
attribute  vec4 vColor;
varying vec4 fColor;

uniform mat4 modelView;
uniform vec4 translate;

void main() 
{
    fColor = vColor;
    gl_Position = modelView * vPosition;

    //creates the fade effect as the objects reach the edge of the screen
    float xCol = abs(gl_Position.x);
	float yCol = abs(gl_Position.y);
    if(xCol >= yCol) {
        fColor = vec4(vColor[0] + xCol, vColor[1] + xCol, vColor[2] + xCol, 1.0);
    } else {
        fColor = vec4(vColor[0] + yCol, vColor[1] + yCol, vColor[2] + yCol, 1.0);
    }
} 
</script>

<script id="fragment-shader" type="x-shader/x-fragment">

precision mediump float;
   
varying vec4 fColor;

void
main()
{
    gl_FragColor = fColor;
}
</script>
